<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
  </defs>

  <!-- graph edges (violet -> cyan) -->
  <g stroke="url(#edgeGrad)" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="256" y1="120" x2="120" y2="360"/>
    <line x1="256" y1="120" x2="392" y2="360"/>
    <line x1="120" y1="360" x2="392" y2="360"/>
  </g>

  <!-- nodes: cyan = AI/signature accent, violet = base -->
  <circle cx="256" cy="120" r="58" fill="url(#nodeGlow)"/>
  <circle cx="120" cy="360" r="46" fill="#8b5cf6"/>
  <circle cx="392" cy="360" r="46" fill="#8b5cf6"/>

  <circle cx="256" cy="120" r="58" fill="none" stroke="#67e8f9" stroke-width="5" opacity="0.5"/>
</svg>
