<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
  </defs>

  <!-- background: rounded square, app bg tone -->
  <rect width="512" height="512" rx="112" fill="#0d0f1a"/>

  <!-- subtle inner border to keep contrast crisp at small sizes -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a2e45" stroke-width="4"/>

  <!-- graph edges (violet -> cyan) -->
  <g stroke="url(#edgeGrad)" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="256" y1="150" x2="150" y2="330"/>
    <line x1="256" y1="150" x2="362" y2="330"/>
    <line x1="150" y1="330" x2="362" y2="330"/>
  </g>

  <!-- nodes: cyan = AI/signature accent -->
  <circle cx="256" cy="150" r="42" fill="url(#nodeGlow)"/>
  <circle cx="150" cy="330" r="34" fill="#8b5cf6"/>
  <circle cx="362" cy="330" r="34" fill="#8b5cf6"/>

  <!-- small highlight on top node for depth -->
  <circle cx="256" cy="150" r="42" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.5"/>
</svg>
